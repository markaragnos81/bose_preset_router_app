# https://developers.home-assistant.io/docs/apps/configuration#app-configuration
name: Bose Preset Router
version: "0.2.0"
slug: bose_router
description: >-
  Phase 2: multi-device Bose SoundTouch status/control server, discoverable
  via Zeroconf, controlled over WebSocket. Full read (info/volume/now_playing
  /presets/sources/zone) and control (play/pause/volume/presets/source
  select/zone) surface ported from bose_preset_router's api.py. Runs outside
  Home Assistant's own process so it can (in later phases) use native
  dependencies HA custom components cannot install, such as libchromaprint
  for AcoustID audio fingerprinting.
url: "https://github.com/markaragnos81/bose_preset_router_app/tree/main/bose_router"
arch:
  - aarch64
  - amd64
init: false
host_network: true
options:
  devices: []
  ws_port: 8765
schema:
  devices:
    - name: "str"
      ip: "str"
  ws_port: "port"
# No `image:` field for now — Supervisor builds locally from the Dockerfile
# below instead of pulling a pre-built registry image. Re-add this (and set
# up a CI build) once the app is ready to be distributed as a prebuilt image.
