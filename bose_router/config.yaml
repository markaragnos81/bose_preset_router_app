# https://developers.home-assistant.io/docs/apps/configuration#app-configuration
name: Bose Preset Router
version: "0.10.0"
slug: bose_router
description: >-
  Controls Bose SoundTouch speakers over your local network — presets,
  volume, playback and physical remote-button presses — with real
  track/artist/cover-art metadata and reliable AirPlay-based preset
  playback. Pair with the "Bose Preset Router (App Client)" HACS
  integration to get media_player entities in Home Assistant.
url: "https://github.com/markaragnos81/bose_preset_router_app/tree/main/bose_router"
arch:
  - aarch64
  - amd64
init: false
host_network: true
options:
  devices: []
  presets: []
  device_preset_overrides: []
  log_level: info
  ws_port: 8765
schema:
  devices:
    - name: "str"
      ip: "str"
      enabled: "bool?"
  presets:
    - id: "int"
      url: "str"
      name: "str?"
  device_preset_overrides:
    - ip: "str"
      id: "int"
      url: "str"
      name: "str?"
  acoustid_api_key: "password?"
  log_level: "list(debug|info|warning|error)"
  ws_port: "port"
# No `image:` field for now — Supervisor builds locally from the Dockerfile
# below instead of pulling a pre-built registry image. Re-add this (and set
# up a CI build) once the app is ready to be distributed as a prebuilt image.
