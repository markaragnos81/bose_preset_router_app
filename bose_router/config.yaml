# https://developers.home-assistant.io/docs/apps/configuration#app-configuration
name: Bose Preset Router
version: "0.1.0"
slug: bose_router
description: >-
  Phase 1 proof-of-concept: standalone Bose SoundTouch status server,
  discoverable via Zeroconf, queried over WebSocket. Runs outside Home
  Assistant's own process so it can (in later phases) use native
  dependencies HA custom components cannot install, such as libchromaprint
  for AcoustID audio fingerprinting.
url: "https://github.com/markaragnos81/bose_preset_router_app/tree/main/bose_router"
arch:
  - aarch64
  - amd64
init: false
host_network: true
options:
  bose_ip: ""
  ws_port: 8765
schema:
  bose_ip: "str"
  ws_port: "port"
image: "ghcr.io/markaragnos81/bose_router-{arch}"
