# https://developers.home-assistant.io/docs/apps/configuration#app-configuration
name: Bose Preset Router
version: "0.4.0"
slug: bose_router
description: >-
  Phase 3: adds AirPlay/RAOP streaming (pyatv) on top of Phase 2's full Bose
  read/control surface, discoverable via Zeroconf, controlled over WebSocket.
  The AirPlay stream+connect lifecycle runs directly on this App's own event
  loop with no thread-isolation workaround — the point of moving off the HA
  custom-component architecture, where pyatv's internal blocking call had to
  be isolated onto a dedicated thread to avoid stalling Home Assistant's own
  shared event loop. Runs outside Home Assistant's own process so it can (in
  later phases) also use native dependencies HA custom components cannot
  install, such as libchromaprint for AcoustID audio fingerprinting.
url: "https://github.com/markaragnos81/bose_preset_router_app/tree/main/bose_router"
arch:
  - aarch64
  - amd64
init: false
host_network: true
options:
  devices: []
  ws_port: 8765
schema:
  devices:
    - name: "str"
      ip: "str"
  ws_port: "port"
# No `image:` field for now — Supervisor builds locally from the Dockerfile
# below instead of pulling a pre-built registry image. Re-add this (and set
# up a CI build) once the app is ready to be distributed as a prebuilt image.
