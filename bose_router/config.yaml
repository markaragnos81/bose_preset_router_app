# https://developers.home-assistant.io/docs/apps/configuration#app-configuration
name: Bose Preset Router
version: "0.9.0"
slug: bose_router
description: >-
  Phase 7: preset maintenance lives in the App's own Configuration tab, not
  the HA client — global default presets (id/url/name) applied to every
  device, with optional per-device overrides (matched by IP) for presets
  that should differ on one speaker. Pushed to each physical device via
  Bose's native storePreset endpoint on every App start. Also carries zone
  (multi-room group) management, ICY multi-second listen, a cooldown-gated
  AcoustID fingerprinting fallback, and the full Bose read/control surface
  with AirPlay/RAOP streaming (pyatv) and no thread-isolation workaround.
  Discoverable via Zeroconf, controlled over WebSocket.
url: "https://github.com/markaragnos81/bose_preset_router_app/tree/main/bose_router"
arch:
  - aarch64
  - amd64
init: false
host_network: true
options:
  devices: []
  ws_port: 8765
  presets: []
  device_preset_overrides: []
schema:
  devices:
    - name: "str"
      ip: "str"
  ws_port: "port"
  acoustid_api_key: "password?"
  presets:
    - id: "int"
      url: "str"
      name: "str"
  device_preset_overrides:
    - ip: "str"
      id: "int"
      url: "str"
      name: "str"
# No `image:` field for now — Supervisor builds locally from the Dockerfile
# below instead of pulling a pre-built registry image. Re-add this (and set
# up a CI build) once the app is ready to be distributed as a prebuilt image.
