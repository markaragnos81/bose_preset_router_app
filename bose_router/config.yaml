# https://developers.home-assistant.io/docs/apps/configuration#app-configuration
name: Bose Preset Router
version: "0.6.0"
slug: bose_router
description: >-
  Phase 5: ICY metadata reads now listen for several seconds instead of a
  single snapshot, since a one-shot read frequently lands on a jingle/ident
  rather than the current song (confirmed live against RadioBob, which does
  send real "Artist - Title" data). AcoustID/Chromaprint audio fingerprinting
  (native libchromaprint, installable here specifically because this runs
  outside Home Assistant's own process) is wired in as a cooldown-gated
  fallback for the rarer stations that never embed song data at all. Also
  carries Phase 2-4: full Bose read/control surface, AirPlay/RAOP streaming
  (pyatv) with no thread-isolation workaround, and ICY/Radio-Browser/iTunes
  metadata enrichment. Discoverable via Zeroconf, controlled over WebSocket.
url: "https://github.com/markaragnos81/bose_preset_router_app/tree/main/bose_router"
arch:
  - aarch64
  - amd64
init: false
host_network: true
options:
  devices: []
  ws_port: 8765
schema:
  devices:
    - name: "str"
      ip: "str"
  ws_port: "port"
  acoustid_api_key: "password?"
# No `image:` field for now — Supervisor builds locally from the Dockerfile
# below instead of pulling a pre-built registry image. Re-add this (and set
# up a CI build) once the app is ready to be distributed as a prebuilt image.
